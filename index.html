<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncly</title>
    <link rel="shortcut icon" href="assets/images/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://necolas.github.io/normalize.css/8.0.1/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main id="container">
        <section id="izquierda">
            <img src="assets/images/icon.png" alt="syncly logo" id="logo">
            <h1 class="title">Work Together, Remotely</h1>
            <h2 id="sub-title">Introducing syncly</h2>
            <p class="description">
                A collaborative tool designed for remote teams. 
                <br>
                Request a demo and experience a better way to stay in sync.
            </p>
            <button id="button-left">Request Demo</button>
        </section>
        <section id="derecha">
            <h2 class="title">Get your Free Demo</h2>
            <p class="description-dos">want to see how syncly can inprove yours team's workflow? fill out the form to get started</p>
            <form action="#" method="post" >
                
                <legend class="contact">Contact Information</legend>
                <div class="dato-formulario">
                    <label for="full-name">*Full name:</label>
                    <input class="input" type="text" name="full-name" id="full-name" placeholder="John Doe" required>
                </div>
                <div class="dato-formulario">
                    <label for="company-name">Company Name:</label>
                    <input class="input" type="text" name="company-name" id="company-name" placeholder="Company Name">
                </div>
                <div class="dato-formulario">
                    <label for="work-email">Work Email:</label>
                    <input class="input" type="email" name="work-email" id="work-email" placeholder="example@gmail.com" required>
                </div>
                <div class="dato-formulario">
                    <label for="role">Role/Position:</label>
                    <input class="input" type="text" name="role" id="role" placeholder="Software Engineer">
                </div>
                <div class="dato-formulario">
                    <label for="message">Messege:</label>
                    <textarea class="input" name="message" id="messege" rows="4" cols="40" placeholder="tell us about your team or what you're looking for."></textarea>
                </div>
                <button id="submit">Messege</button>
            </form>
            
        </section>
    </main>
</body>
</html>
